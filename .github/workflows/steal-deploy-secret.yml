# TEST (Kai): steal the deploy secret from a pull request. NEVER MERGE THIS BRANCH.
#
# Plays an attacker who can open a pull request. It tries to read the deploy secret two ways.
# The fake one is printed base64-encoded, which slips past GitHub's *** log masking.
#
#   UNSAFE_DEPLOY_TOKEN  repository secret, how the unsecured pipeline stores it -> expected to LEAK
#   DEPLOY_TOKEN         production environment secret (secured pipeline)       -> expected to be EMPTY or REFUSED
#
# UNSAFE_DEPLOY_TOKEN must be a fake random value. DEPLOY_TOKEN is the real Render hook, so only
# its length and fingerprint are printed, never the value.

name: "TEST (Kai): steal the deploy secret"

on: pull_request

permissions: {}

jobs:
  # Attack 1: just ask for the secrets.
  steal-without-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Try to read both secrets
        env:
          UNSAFE: ${{ secrets.UNSAFE_DEPLOY_TOKEN }}
          SAFE: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "UNSAFE_DEPLOY_TOKEN length ${#UNSAFE}, base64: $(printf %s "$UNSAFE" | base64)"
          # DEPLOY_TOKEN is the real Render hook: if it ever leaks, show proof (fingerprint) but not the value.
          echo "DEPLOY_TOKEN        length ${#SAFE}, fingerprint: $(printf %s "$SAFE" | sha256sum | cut -c1-12)"

  # Attack 2: claim to be the production deploy so GitHub hands over the environment secret.
  steal-with-environment:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Try to read the environment secret
        env:
          SAFE: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "DEPLOY_TOKEN length ${#SAFE}, fingerprint: $(printf %s "$SAFE" | sha256sum | cut -c1-12)"
