# test 3: a PR tries to read the deploy secret. don't merge

name: "Test: steal the deploy secret"

on: pull_request

permissions: {}

jobs:
  # repo secret vs environment secret
  steal-without-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Try to read both secrets
        env:
          UNSAFE: ${{ secrets.UNSAFE_DEPLOY_TOKEN }}
          SAFE: ${{ secrets.DEPLOY_TOKEN }}
        # base64 gets past github hiding secrets as ***
        run: |
          echo "UNSAFE_DEPLOY_TOKEN length ${#UNSAFE}, base64: $(printf %s "$UNSAFE" | base64)"
          echo "DEPLOY_TOKEN        length ${#SAFE}, fingerprint: $(printf %s "$SAFE" | sha256sum | cut -c1-12)"

  # try to use the production environment from a PR branch
  steal-with-environment:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Try to read the environment secret
        env:
          SAFE: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "DEPLOY_TOKEN length ${#SAFE}, fingerprint: $(printf %s "$SAFE" | sha256sum | cut -c1-12)"
