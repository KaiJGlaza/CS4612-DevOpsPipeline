# Secured pipeline, ship stage (Kai).
# Runs only after code reaches main, and main only accepts pull requests that passed
# the scans (Trivy, Gitleaks, CodeQL) and a teammate review. See the main-branch ruleset.
#
#   build + test the image  ->  TEAMMATE APPROVES (production environment)  ->  push to GHCR
#
# The deploy job is the only place DEPLOY_TOKEN exists. It is an environment secret, so
# pull requests, other branches and fork PRs never receive it.

name: Secure deploy

on:
  push:
    branches: [main]

# Start every job with no token permissions, then grant each job only what it needs.
permissions: {}

# One deploy at a time. Never cancel a deploy that is halfway through.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get the repo's files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the container image
        run: docker build -t cs4612-app app

      # Test the exact image that will ship, not a copy built on the runner.
      - name: Run the tests inside the image
        run: docker run --rm cs4612-app python -m pytest -p no:cacheprovider

      - name: Save the image
        run: docker save cs4612-app -o image.tar

      - name: Hand the image to the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pauses here until a teammate (not the person who pushed) approves in the Actions tab.
    # The environment only accepts the main branch and holds DEPLOY_TOKEN.
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kaijglaza/cs4612-devopspipeline
    steps:
      - name: Get the approved image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Load the image
        run: docker load -i image.tar

      # Prove the locked secret is here without ever printing it.
      - name: Check the deploy secret
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::DEPLOY_TOKEN is missing. It only exists in the production environment."
            exit 1
          fi
          echo "DEPLOY_TOKEN present, fingerprint $(printf %s "$DEPLOY_TOKEN" | sha256sum | cut -c1-12)"

      - name: Log in to GitHub's container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ship the image
        run: |
          docker tag cs4612-app "$IMAGE:${GITHUB_SHA::7}"
          docker tag cs4612-app "$IMAGE:latest"
          docker push --all-tags "$IMAGE"
