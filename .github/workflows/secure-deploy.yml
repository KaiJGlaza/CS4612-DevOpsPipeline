name: Secure deploy

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    # ubuntu-latest is now 26.04 with docker 29, and the ghcr push failed there with "denied"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Get the repo's files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the container image
        run: docker build -t cs4612-app app

      - name: Run the tests inside the image
        run: docker run --rm cs4612-app python -m pytest -p no:cacheprovider

      - name: Save the image
        run: docker save cs4612-app -o image.tar

      - name: Upload the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    # waits here for a teammate to approve. DEPLOY_TOKEN only exists in this environment
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kaijglaza/cs4612-devopspipeline
    steps:
      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Load the image
        run: docker load -i image.tar

      # print a hash of the secret, never the secret
      - name: Check the deploy secret
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::DEPLOY_TOKEN is missing"
            exit 1
          fi
          echo "DEPLOY_TOKEN present, fingerprint $(printf %s "$DEPLOY_TOKEN" | sha256sum | cut -c1-12)"

      - name: Log in to GitHub's container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        run: |
          docker tag cs4612-app "$IMAGE:${GITHUB_SHA::7}"
          docker tag cs4612-app "$IMAGE:latest"
          docker push --all-tags "$IMAGE"
