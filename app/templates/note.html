{% extends "base.html" %}

{% block title %}{{ note.title }} · Notes{% endblock %}

{% block main %}
<h1>{{ note.title }}</h1>
<div class="note-body">{{ note.body }}</div>

<details class="delete">
  <summary>
    <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
    Delete note
  </summary>
  <p>This can't be undone.</p>
  <form method="post" action="{{ url_for('delete_note', note_id=note.id) }}">
    <button class="button button-danger">Delete permanently</button>
  </form>
</details>
{% endblock %}
