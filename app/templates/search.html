{% extends "base.html" %}

{% block title %}Search · Notes{% endblock %}

{% block main %}
<h1>Results for {{ q }}</h1>
{% if results %}
<ul class="results">
  {% for note in results %}
  <li><a href="{{ url_for('view_note', note_id=note.id) }}">{{ note.title }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p class="muted">No notes found.</p>
{% endif %}
{% endblock %}
